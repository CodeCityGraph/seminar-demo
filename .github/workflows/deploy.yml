name: AI-Powered Gatekeeper Deploy
on:
  push:
    branches: [ demo-test-2 ] # Triggers only on your specific branch

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read # Allows the AI to read your code for fixes
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 1. Deploy a private Preview to Vercel
      - name: Create Vercel Preview
        id: deploy_preview
        run: |
          # Captures the unique preview URL from the CLI output
          URL=$(npx vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "PREVIEW_URL=$URL" >> $GITHUB_ENV
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # 2. Run all tests (UI, Smoke, Unit) against the Preview URL
      - name: Run Playwright Tests (tests folder)
        id: run_tests
        working-directory: ${{ github.workspace }}
        run: npx playwright test ./tests
        env:
          BASE_URL: ${{ env.PREVIEW_URL }}

      # 3. If tests FAIL, ask GitHub AI for a fix
      - name: AI Fix Suggestion
        if: failure()
        uses: actions/ai-inference@v1
        with:
          model: gpt-4o-mini
          token: ${{ secrets.GH_PAT }}
          prompt: |
            The Playwright tests failed on the 'demo-test-2' branch. 
            The Preview URL was: ${{ env.PREVIEW_URL }}
            Please analyze the repository code and suggest a fix for the failing tests.
            Focus on UI elements or form validations that might be broken.

      # 4. If tests PASS, promote this exact build to Production
      - name: Promote to Production
        if: success()
        run: npx vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}