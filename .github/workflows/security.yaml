name: Security Scan

on:
  push:
    branches:
      - dev
      - Main
      - Joseph-Dev-Branck
  pull_request:
    branches:
      - Main
      - dev
  workflow_dispatch:

jobs:
  dependency-audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high

  zap-mcp-scan:
    name: ZAP MCP Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      ZAP_API_KEY: ''
      ZAP_API_URL: http://localhost:8090
      TARGET_URL: ${{ secrets.PRODUCTION_URL || 'https://seminar-demo.vercel.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start ZAP daemon
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          docker run -d --name zap \
            -p 8090:8090 \
            -e JAVA_OPTS="-Xmx1g -XX:+UseG1GC" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -daemon \
            -port 8090 \
            -host 0.0.0.0 \
            -config api.disablekey=true \
            -config api.addrs.addr.name=.* \
            -config api.addrs.addr.regex=true \
            -config api.addrs.addr.enabled=true
          docker ps

      - name: Wait for ZAP API to be ready
        run: |
          echo "Waiting for ZAP daemon (up to 10 minutes)..."
          sleep 45
          MAX_ATTEMPTS=110
          RETRY_INTERVAL=5
          for i in $(seq 1 "$MAX_ATTEMPTS"); do
            if curl -sf --max-time 5 "http://localhost:8090/JSON/core/view/version/" > /dev/null 2>&1; then
              echo "ZAP is ready after ~$((45 + i * RETRY_INTERVAL))s"
              exit 0
            fi

            STATUS=$(docker inspect -f '{{.State.Status}}' zap 2>/dev/null || echo "unknown")
            if [ "$STATUS" = "exited" ]; then
              echo "::error::ZAP container exited before becoming ready"
              docker logs --tail 200 zap || true
              exit 1
            fi

            if [ $((i % 10)) -eq 0 ]; then
              echo "Attempt $i/$MAX_ATTEMPTS - container: $STATUS"
            fi

            sleep "$RETRY_INTERVAL"
          done
          echo "--- ZAP container logs ---"
          docker logs --tail 200 zap || true
          echo "::error::ZAP daemon did not start in time" && exit 1

      - name: Install scan script dependencies
        run: npm install node-fetch@3

      - name: Run ZAP API scan (spider + passive scan)
        run: |
          cat > zap-mcp-scan.cjs << 'SCRIPT'
          const fetch = global.fetch || ((...args) => import('node-fetch').then(({ default: f }) => f(...args)));
          const fs = require('fs');

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function getJson(url) {
            const res = await fetch(url);
            if (!res.ok) {
              throw new Error(`HTTP ${res.status} from ${url}`);
            }
            return await res.json();
          }

          async function main() {
            const api = process.env.ZAP_API_URL;
            const target = process.env.TARGET_URL;

            console.log(`Spidering ${target}...`);
            const spiderStart = await getJson(`${api}/JSON/spider/action/scan/?url=${encodeURIComponent(target)}&maxChildren=10&recurse=true`);
            const scanId = spiderStart.scan;

            let spiderStatus = '0';
            for (let i = 0; i < 120; i++) {
              const statusJson = await getJson(`${api}/JSON/spider/view/status/?scanId=${scanId}`);
              spiderStatus = statusJson.status || '0';
              if (Number(spiderStatus) >= 100) {
                break;
              }
              if (i % 6 === 0) {
                console.log(`Spider progress: ${spiderStatus}%`);
              }
              await sleep(2000);
            }
            console.log(`Spider finished with status ${spiderStatus}%`);

            // Give passive scanner time to process discovered URLs.
            for (let i = 0; i < 30; i++) {
              const pscan = await getJson(`${api}/JSON/pscan/view/recordsToScan/`);
              const remaining = Number(pscan.recordsToScan || 0);
              if (remaining <= 0) {
                break;
              }
              if (i % 5 === 0) {
                console.log(`Passive scan queue remaining: ${remaining}`);
              }
              await sleep(2000);
            }

            console.log('Retrieving alerts...');
            const alertsJson = await getJson(`${api}/JSON/core/view/alerts/?baseurl=${encodeURIComponent(target)}&start=0&count=9999`);
            const alerts = alertsJson.alerts || [];

            const report = {
              target,
              timestamp: new Date().toISOString(),
              spider: { status: spiderStatus },
              alerts,
            };

            fs.writeFileSync('zap-mcp-report.json', JSON.stringify(report, null, 2));
            const alertCount = Array.isArray(alerts) ? alerts.length : 'unknown';
            console.log(`Scan complete. ${alertCount} alerts written to zap-mcp-report.json`);
          }

          main().catch(e => {
            console.error('ZAP API scan error:', e.message);
            process.exit(1);
          });
          SCRIPT
          node zap-mcp-scan.cjs
        continue-on-error: true

      - name: AI Remediation Analysis (Gemini)
        if: always() && env.GEMINI_API_KEY != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
        run: |
          REPORT_FILE="zap-mcp-report.json"
          if [ ! -f "$REPORT_FILE" ]; then
            echo "No ZAP MCP report found, skipping AI analysis." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Trim to top 20 alerts to stay within token limits
          export ALERTS=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('$REPORT_FILE'));
            const raw = Array.isArray(r.alerts) ? r.alerts
              : (Array.isArray(r.alerts?.content) ? r.alerts.content : []);
            const top = raw
              .sort((a,b) => Number(b.riskcode || 0) - Number(a.riskcode || 0))
              .slice(0, 20)
              .map(a => ({ name: a.alert || a.name, risk: a.riskdesc || a.risk, desc: a.desc, solution: a.solution }));
            console.log(JSON.stringify(top));
          ")

          export PROMPT="You are a security expert. Below are the top findings from an OWASP ZAP API scan of a Node.js web app. For each finding, provide: 1) a plain-English explanation of the risk, 2) a concrete code-level fix specific to a Node.js/Express app. Be concise.\n\nFindings:\n$ALERTS"

          RESPONSE=$(node -e "
            async function run() {
              const url = 'https://generativelanguage.googleapis.com/v1beta/models/' + process.env.GEMINI_MODEL + ':generateContent?key=' + process.env.GEMINI_API_KEY;
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ role: 'user', parts: [{ text: process.env.PROMPT }] }],
                  generationConfig: { temperature: 0.2 }
                })
              });
              const json = await res.json();
              const text = json?.candidates?.[0]?.content?.parts?.[0]?.text || 'No response from Gemini.';
              console.log(text);
            }
            run().catch(e => { console.error(e.message); process.exit(1); });
          " 2>&1) || RESPONSE="Gemini request failed."

          {
            echo "## AI Security Remediation (Gemini)"
            echo ""
            echo "$RESPONSE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ZAP MCP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-mcp-reports
          path: zap-mcp-report.json
          if-no-files-found: ignore

      - name: Stop ZAP daemon
        if: always()
        run: docker rm -f zap || true
